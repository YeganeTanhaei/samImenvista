{% extends 'base.html' %}
{% block style %}
    <style>
        /* ===== RESET & BASE - FIXED FOR CHROME ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* REMOVED: width:390px, height:1141px, overflow:hidden, position:relative from html */
        html {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh; /* dynamic viewport height for mobile */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: auto;
            position: relative;
            background: #f7f9fc;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .pt-safe {
            padding-top: env(safe-area-inset-top, 0px);
        }

        /* Hide scrollbar but keep scroll functionality */
        ::-webkit-scrollbar {
            width: 0;
            height: 0;
            background: transparent;
            display: none;
        }

        /* Firefox scrollbar hide */
        * {
            scrollbar-width: none;
        }

        /* ===== FIX FOR MAIN CONTENT ===== */
        main {
            display: flex;
            flex-direction: column;
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding-top: 64px;
            padding-bottom: 80px;
            background: #f7f9fc;
        }

        /* Safari specific fix */
        @supports (-webkit-touch-callout: none) {
            body {
                min-height: -webkit-fill-available;
            }
        }

        /* ===== TAILWIND OVERRIDES ===== */
        .bg-background {
            background-color: #f7f9fc;
        }

        .bg-surface {
            background-color: #f7f9fc;
        }

        .bg-surface-container-low {
            background-color: #f2f4f7;
        }

        .bg-surface-container {
            background-color: #eceef1;
        }

        .bg-surface-container-lowest {
            background-color: #ffffff;
        }

        .bg-primary-container {
            background-color: #d32f2f;
        }

        .bg-on-secondary-fixed {
            background-color: #d7e3f7;
        }

        .bg-surface\/80 {
            background-color: rgba(247, 249, 252, 0.8);
        }

        .bg-primary\/90 {
            background-color: rgba(175, 16, 26, 0.9);
        }

        .text-on-background {
            color: #191c1e;
        }

        .text-on-surface {
            color: #191c1e;
        }

        .text-on-surface-variant {
            color: #5b403d;
        }

        .text-primary {
            color: #af101a;
        }

        .text-primary-fixed {
            color: #ffdad6;
        }

        .text-on-primary {
            color: #ffffff;
        }

        .text-secondary-fixed {
            color: #d7e3f7;
        }

        .border-outline-variant {
            border-color: #e4beba;
        }

        .border-outline {
            border-color: #8f6f6c;
        }

        .border-on-secondary-fixed-variant {
            border-color: #3c4858;
        }

        .shadow-sm {
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .shadow-md {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .backdrop-blur-sm {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .backdrop-blur-xl {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .snap-x {
            scroll-snap-type: x mandatory;
        }

        .snap-start {
            scroll-snap-align: start;
        }

        .scroll-pl-margin-mobile {
            scroll-padding-left: 16px;
            scroll-padding-right: 16px;
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#ffb3ac",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffe170",
                        "surface-tint": "#ba1a20",
                        "primary": "#af101a",
                        "primary-container": "#d32f2f",
                        "on-primary-container": "#fff2f0",
                        "on-primary-fixed": "#410003",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#101c2b",
                        "surface-bright": "#f7f9fc",
                        "primary-fixed": "#ffdad6",
                        "secondary-container": "#d4e1f5",
                        "on-secondary-container": "#576474",
                        "surface-container-highest": "#e0e3e6",
                        "surface-dim": "#d8dadd",
                        "on-surface-variant": "#5b403d",
                        "on-background": "#191c1e",
                        "surface-container-low": "#f2f4f7",
                        "secondary-fixed": "#d7e3f7",
                        "on-error": "#ffffff",
                        "inverse-primary": "#ffb3ac",
                        "error": "#ba1a1a",
                        "secondary": "#535f70",
                        "secondary-fixed-dim": "#bbc7db",
                        "outline-variant": "#e4beba",
                        "tertiary-container": "#caa900",
                        "tertiary-fixed-dim": "#e9c400",
                        "background": "#f7f9fc",
                        "inverse-surface": "#2d3133",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface": "#f7f9fc",
                        "on-surface": "#191c1e",
                        "outline": "#8f6f6c",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#eff1f4",
                        "surface-container-high": "#e6e8eb",
                        "on-tertiary-fixed-variant": "#544600",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#221b00",
                        "on-tertiary-container": "#4c3f00",
                        "on-secondary-fixed-variant": "#3c4858",
                        "surface-variant": "#e0e3e6",
                        "surface-container": "#eceef1",
                        "tertiary": "#705d00",
                        "on-primary-fixed-variant": "#930010"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "container-max": "1280px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "margin-desktop": "48px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Vazirmatn"],
                        "headline-lg-mobile": ["Vazirmatn"],
                        "headline-md": ["Vazirmatn"],
                        "label-lg": ["Vazirmatn"],
                        "body-lg": ["Vazirmatn"],
                        "headline-lg": ["Vazirmatn"],
                        "body-md": ["Vazirmatn"],
                        "label-md": ["Vazirmatn"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", {"lineHeight": "64px", "fontWeight": "800"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "44px", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
{% endblock %}

{% block content %}
<body class="bg-background font-body-md text-on-background">
<!-- MAIN CONTENT -->
<main>
    <div class="flex flex-col w-full px-margin-mobile py-stack-md gap-stack-lg max-w-[1280px] mx-auto">

        <div class="flex flex-col gap-stack-sm">
            <h1 class="font-headline-lg-mobile text-on-background">محصولات ما</h1>
            <p class="font-body-md text-on-surface-variant">پمپ‌های آتش‌نشانی</p>
        </div>

        <!-- Category Filters -->
        <div class="flex gap-stack-sm overflow-x-auto pb-stack-sm -mx-margin-mobile px-margin-mobile snap-x scroll-pl-margin-mobile hide-scrollbar md:mx-0 md:px-0">
            <a href="{% url 'information_fire' %}"><button class="snap-start shrink-0 px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface font-label-md whitespace-nowrap transition-colors hover:bg-surface-container-low hover:border-outline">
                آتش‌نشانی
            </button></a>
            <a href="{% url 'all_ambulance' %}"><button class="snap-start shrink-0 px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface font-label-md whitespace-nowrap transition-colors hover:bg-surface-container-low hover:border-outline">
                آمبولانس
            </button></a>
            <a href="{% url 'own_municipality' %}"><button class="snap-start shrink-0 px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface font-label-md whitespace-nowrap transition-colors hover:bg-surface-container-low hover:border-outline">
                خدمات شهری
            </button></a>
            <a href="{% url 'my_pump' %}"><button class="snap-start shrink-0 px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface font-label-md whitespace-nowrap transition-colors hover:bg-surface-container-low hover:border-outline">
                پمپ
            </button></a>
        </div>

        <!-- Products Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-stack-md sm:gap-gutter">
            <!-- Product Card  -->
            {% for pump in pump_info %}
                <article
                        class="flex flex-col bg-surface rounded-xl overflow-hidden shadow-md group hover:shadow-lg transition-shadow cursor-pointer">
                    <div class="w-full h-48 md:h-56 overflow-hidden relative">
                        <a href="{{ pump.get_absolute_url }}">
                            <img src="{{ pump.image_title.url }}"
                                 alt="Team Image"
                                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        </a>
                    </div>
                    <div class="p-4 bg-inverse-surface text-inverse-on-surface flex flex-col gap-1 relative z-10">
                        <h3 class="font-headline-lg-mobile md:font-headline-md text-headline-lg-mobile md:text-headline-md truncate">
                            <a href="{{ pump.get_absolute_url }}">{{ pump.pump_model }}</a>
                        </h3>
                    </div>
                </article>
            {% endfor %}
        </div>
    </div>
</main>
</body>
{% endblock %}
